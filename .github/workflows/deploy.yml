
name: Deploy to Production

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install SSH Key
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_KEY }}

      - name: Deploy Code
        run: |
          ssh -o StrictHostKeyChecking=no \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} << 'EOF'

            set -e

            cd "${{ secrets.DEPLOY_PATH }}" || exit 1

            echo "========================================"
            echo "Starting production deployment"
            echo "========================================"

            # Pull latest code with retry
            echo "Pulling latest code..."

            for i in 1 2 3; do
              echo "Git pull attempt $i..."

              if git pull origin main; then
                echo "Git pull successful."
                break
              fi

              if [ "$i" -eq 3 ]; then
                echo "Git pull failed after 3 attempts."
                exit 1
              fi

              echo "Git pull failed. Retrying in 10 seconds..."
              sleep 10
            done

            # Put application into maintenance mode
            echo "Enabling maintenance mode..."
            /usr/bin/php8.4 artisan down || true

            # If deployment fails after maintenance mode is enabled,
            # attempt to bring the application back online.
            trap '/usr/bin/php8.4 artisan up || true' EXIT

            # Install PHP dependencies
            echo "Installing Composer dependencies..."

            /usr/bin/php8.4 /usr/local/bin/composer install \
              --no-interaction \
              --no-dev \
              --optimize-autoloader \
              --no-progress

            # Create required storage directories
            echo "Creating required directories..."

            mkdir -p storage/framework/cache
            mkdir -p storage/framework/sessions
            mkdir -p storage/framework/views
            mkdir -p storage/framework/testing
            mkdir -p storage/logs
            mkdir -p storage/app/public
            mkdir -p bootstrap/cache

            # Build frontend assets
            echo "Installing NPM dependencies..."

            npm install

            echo "Building frontend assets..."

            npm run build

            # Clear and rebuild Laravel caches
            echo "Optimizing Laravel..."

            /usr/bin/php8.4 artisan optimize:clear
            /usr/bin/php8.4 artisan config:cache
            /usr/bin/php8.4 artisan route:cache
            /usr/bin/php8.4 artisan view:cache

            # Run database migrations
            echo "Running database migrations..."

            /usr/bin/php8.4 artisan migrate --force

            # Fix permissions
            echo "Fixing permissions..."

            sudo chown -R deployer:www-data .
            sudo chmod -R 775 storage bootstrap/cache
            sudo chmod 640 .env

            # Restart PHP-FPM
            echo "Restarting PHP 8.4 FPM..."

            sudo systemctl restart php8.4-fpm

            # Restart Supervisor workers
            echo "Restarting Supervisor workers..."

            sudo supervisorctl restart bugs-worker:*

            # Bring application back online
            echo "Disabling maintenance mode..."

            /usr/bin/php8.4 artisan up

            # Deployment completed successfully.
            # Remove the failure trap so it does not run unnecessarily.
            trap - EXIT

            echo "========================================"
            echo "Deployment completed successfully"
            echo "========================================"

          EOF
